<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.player-container{
    width:95%;
    max-width:900px;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 30px #000;
}

video{
    width:100%;
    height:auto;
    background:black;
}

.controls{
    padding:15px;
    background:#181818;
    display:flex;
    gap:10px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.status{
    padding:10px;
    font-size:14px;
    color:#0f0;
}
</style>

</head>

<body>


<div class="player-container">

<video id="video" controls autoplay playsinline></video>

<div class="controls">

<button onclick="playVideo()">▶ Play</button>

<button onclick="pauseVideo()">⏸ Pause</button>

<button onclick="fullscreen()">⛶ Fullscreen</button>

</div>

<div class="status" id="status">
Carregando stream...
</div>

</div>


<script>

const video = document.getElementById("video");
const status = document.getElementById("status");


const streamURL =
"http://plutovip.eu:8880/live/osni1111/Online999/11127.m3u8";


let hls;


function loadStream(){

if(Hls.isSupported()){

    hls = new Hls({
        enableWorker:true,
        lowLatencyMode:true,
        maxBufferLength:30
    });


    hls.loadSource(streamURL);

    hls.attachMedia(video);


    hls.on(Hls.Events.MANIFEST_PARSED,function(){

        status.innerHTML="Stream carregado ✔";

        video.play();

    });


    hls.on(Hls.Events.ERROR,function(event,data){

        console.log(data);

        status.innerHTML=
        "Erro: "+data.details;

    });


}

else if(video.canPlayType("application/vnd.apple.mpegurl")){

    video.src=streamURL;

    video.play();

}

else{

status.innerHTML=
"Este navegador não suporta HLS";

}


}



function playVideo(){
video.play();
}


function pauseVideo(){
video.pause();
}


function fullscreen(){

if(video.requestFullscreen){

video.requestFullscreen();

}

}


loadStream();


</script>


</body>
</html>
